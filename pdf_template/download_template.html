html{

body {

  height: 100%;

.container {

  margin: auto;
  height: 100%;
}

.logos {

  padding-top: 50px;

.logos img {
  height: 200px;
}

h1 {

.subtitle {

}

.download-btn {
  display: inline-block;
  background: #ffd84d;
  border-radius: 50px;
  padding: 25px 70px;
  font-size: 48px;
  font-weight: bold;
  color: #c10000;
  text-decoration: none;
  border: 6px solid #000;
  box-shadow: 0 8px 0 #000;
  margin: 20px 0;
}

.download-link {
  display: inline-block;
  padding: 15px;
  background: white;
  border: 2px solid #333;
  border-radius: 8px;
  margin: 15px 0;
  font-size: 18px;
  word-break: break-all;
}

.cta {
  background: #ff4d4d;
  color: white;
  padding: 12px 30px;
  border-radius: 30px;
  display: inline-block;
  margin-top: 15px;
  font-size: 22px;
}

.big {
  font-size: 80px;
  color: #ff4d4d;
  font-weight: bold;
}

.footer {
  margin-top: 20px;
  font-size: 22px;
}
